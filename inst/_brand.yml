meta:
  name: GOV.UK Frontend
  link: https://github.com/alphagov/govuk-frontend
  description: >
    An unofficial brand.yml capturing the GOV.UK Design System's colour and
    typography tokens for use with Bootstrap-based Quarto documents, bslib
    Shiny apps, and pkgdown sites.

logo:
  images:
    crest: logo/govuk-crest.svg
    favicon: logo/favicon.ico
  small: favicon
  medium: crest
  large: crest

color:
  palette:
    brand-colour: "#1d70b8"
    text-colour: "#0b0c0c"
    secondary-text-colour: "#484949"
    error-colour: "#ca3535"
    success-colour: "#0f7a52"
    focus-colour: "#ffdd00"
    focus-text-colour: "#0b0c0c"
    link-colour: "#1a65a6"
    link-visited-colour: "#54319f"
    link-hover-colour: "#0f385c"
    link-active-colour: "#0b0c0c"
    border-colour: "#cecece"
    surface-background-colour: "#f4f8fb"
    surface-border-colour: "#8eb8dc"
    # Not a GOV.UK Frontend token (it doesn't style code blocks). Taken
    # from design-system.service.gov.uk's own compiled CSS, which pairs
    # this background with the standard text colour.
    code-background-colour: "#f3f3f3"
  foreground: text-colour
  background: "#ffffff"
  primary: brand-colour
  secondary: secondary-text-colour
  success: success-colour
  danger: error-colour
  warning: focus-colour
  info: link-colour

# GDS Transport (GOV.UK's typeface) is only licensed for *.gov.uk services,
# so it's excluded here. This is the plain Arial fallback that GOV.UK
# Frontend itself uses when GDS Transport isn't available.
typography:
  base:
    family: "Arial, sans-serif"
  headings:
    family: "Arial, sans-serif"
    weight: 700
  link:
    color: link-colour
    decoration: underline
  monospace:
    family: >-
      ui-monospace, menlo, "Cascadia Mono", "Segoe UI Mono", consolas,
      "Liberation Mono", monospace
  monospace-inline:
    color: text-colour
    background-color: code-background-colour
  monospace-block:
    color: text-colour
    background-color: code-background-colour

defaults:
  bootstrap:
    defaults:
      link-hover-color: "#0f385c" # link-hover-colour
      link-decoration: underline
    rules: |
      // Quarto/bslib shows this brand's logo (the GOV.UK crest) in the
      // navbar by default. Hidden here, since most sites using this brand
      // aren't official government services. To show it, override
      // .navbar-logo (e.g. in your own _quarto.yml `format.html.css`):
      //   .navbar-logo { display: inline-block !important; }
      .navbar-logo {
        display: none !important;
      }

      // Matches GOV.UK's link underline style: thicker, offset from the
      // text, and thicker again on hover with no gaps around descenders
      // like "g"/"y". Bootstrap's `link-decoration: underline` only sets
      // `text-decoration`, not these extra properties - see
      // https://design-system.service.gov.uk/styles/typography/#links
      // The CSS `max()` is wrapped in `#{"..."}` so Sass passes it
      // straight to the browser instead of trying to evaluate it itself.
      a {
        text-decoration-thickness: #{"max(1px, .0625rem)"};
        text-underline-offset: .1105em;
      }

      a:hover {
        text-decoration-thickness: #{"max(3px, .1875rem)"};
        text-decoration-skip-ink: none;
      }

      // Matches GOV.UK's focus style: a solid yellow background with a
      // black shadow beneath, never just an outline. Text is forced to
      // black, otherwise components with their own focus colour (e.g.
      // white navbar links) would keep white text on yellow, which fails
      // accessibility checks. Bootstrap's own :focus rules also use
      // !important and can be more specific than a single :focus selector,
      // so :focus is repeated here to win on specificity instead of
      // targeting every component individually.
      :focus:focus:focus:focus:focus {
        outline: 3px solid transparent !important;
        background-color: $warning !important;
        box-shadow: 0 -2px $warning, 0 4px $body-color !important;
        text-decoration: none !important;
        color: $body-color !important;
      }

      // Some components (e.g. Quarto's search icon) set their own colour
      // on a child element instead of inheriting it, so the rule above
      // doesn't reach them - this forces it down explicitly.
      // `background-color` is also reset, so inline code (which has its
      // own grey background) doesn't sit as a grey box on top of the
      // yellow focus fill.
      :focus:focus:focus:focus:focus * {
        color: $body-color !important;
        background-color: transparent !important;
      }

      // Inputs and search boxes keep their own background and get an
      // outline instead of a fill, so typed text stays readable -
      // matching GOV.UK's real input focus style, which is outline-only.
      // The extra type selector makes this win over the general focus
      // rule above for the same element.
      input:focus:focus:focus:focus:focus,
      textarea:focus:focus:focus:focus:focus,
      select:focus:focus:focus:focus:focus {
        background-color: $body-bg !important;
        outline: 3px solid $warning !important;
        outline-offset: 0 !important;
        box-shadow: inset 0 0 0 2px $body-color !important;
      }
