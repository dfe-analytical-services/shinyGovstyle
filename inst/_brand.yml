meta:
  name: GOV.UK Frontend
  link: https://github.com/alphagov/govuk-frontend
  description: >
    An unofficial brand.yml capturing the GOV.UK Design System's colour and
    typography tokens for use with Bootstrap-based Quarto documents, bslib
    Shiny apps, and pkgdown sites.

logo:
  images:
    crest: logo/govuk-crest.svg
    favicon: logo/favicon.ico
  small: favicon
  medium: crest
  large: crest

color:
  palette:
    brand-colour: "#1d70b8"
    text-colour: "#0b0c0c"
    secondary-text-colour: "#484949"
    error-colour: "#ca3535"
    success-colour: "#0f7a52"
    focus-colour: "#ffdd00"
    focus-text-colour: "#0b0c0c"
    link-colour: "#1a65a6"
    link-visited-colour: "#54319f"
    link-hover-colour: "#0f385c"
    link-active-colour: "#0b0c0c"
    border-colour: "#cecece"
    surface-background-colour: "#f4f8fb"
    surface-border-colour: "#8eb8dc"
    # Not a govuk-frontend token (frontend doesn't style code blocks) -
    # taken from design-system.service.gov.uk's own compiled CSS instead,
    # where `code` uses this background with the standard text-colour.
    code-background-colour: "#f3f3f3"
  foreground: text-colour
  background: "#ffffff"
  primary: brand-colour
  secondary: secondary-text-colour
  success: success-colour
  danger: error-colour
  warning: focus-colour
  info: link-colour

# GDS Transport (GOV.UK's typeface) is licensed for *.gov.uk services only,
# so it's deliberately excluded here. This is
# the plain "arial, sans-serif" stack GOV.UK Frontend's own compiled CSS
# falls through to when GDS Transport isn't available.
typography:
  base:
    family: "Arial, sans-serif"
  headings:
    family: "Arial, sans-serif"
    weight: 700
  link:
    color: link-colour
    decoration: underline
  monospace:
    family: >-
      ui-monospace, menlo, "Cascadia Mono", "Segoe UI Mono", consolas,
      "Liberation Mono", monospace
  monospace-inline:
    color: text-colour
    background-color: code-background-colour
  monospace-block:
    color: text-colour
    background-color: code-background-colour

defaults:
  bootstrap:
    defaults:
      link-hover-color: "#0f385c" # link-hover-colour
      link-decoration: underline
    rules: |
      // Quarto/bslib auto-show this brand's logo (the GOV.UK crest, via
      // logo.small) in a website navbar by default. Off by default here -
      // a crest in the corner of every page reads as an official
      // government service, which most consumers of this brand won't be.
      // To show it anyway, override this selector (e.g. in your own
      // _quarto.yml `format.html.css` or a project-level Sass rule):
      //   .navbar-logo { display: inline-block !important; }
      .navbar-logo {
        display: none !important;
      }

      // GOV.UK Design System's link underline: thicker and offset from the
      // text rather than sitting flush against descenders, thicker again on
      // hover with ink-skipping off (so the underline doesn't break around
      // descenders like "g"/"y"). Bootstrap's `link-decoration: underline`
      // default only sets `text-decoration`, not these - see
      // https://design-system.service.gov.uk/styles/typography/#links
      // `max()`/`min()` mixing px and rem must be interpolated as a string
      // (`#{"..."}`) - Sass's own `max()` function (distinct from the CSS
      // one) errors on incompatible units, so this forces it through as
      // plain, unevaluated CSS for the browser to resolve instead.
      a {
        text-decoration-thickness: #{"max(1px, .0625rem)"};
        text-underline-offset: .1105em;
      }

      a:hover {
        text-decoration-thickness: #{"max(3px, .1875rem)"};
        text-decoration-skip-ink: none;
      }

      // Approximates GOV.UK's distinctive two-tone focus state: a solid
      // yellow background with a black "shadow" beneath, and no reliance
      // on colour alone (focused elements are never just outlined). Text
      // is forced to black - yellow-on-white would otherwise persist on
      // any component with its own more specific `:focus`/`:hover` colour
      // (e.g. navbar links use white text), an accessibility issue.
      // Bootstrap 5 itself uses !important on several of its own :focus
      // rules (e.g. link-opacity utilities), and those are often *more*
      // specific than a plain `:focus` (e.g. `.navbar-nav .nav-link:focus`
      // is 3 selectors vs. our 1) - so among competing !important rules,
      // specificity still decides the winner. `:focus` is repeated to
      // out-rank those rather than chasing every component's own selector.
      // Feels hacky but seems to work!
      :focus:focus:focus:focus:focus {
        outline: 3px solid transparent !important;
        background-color: $warning !important;
        box-shadow: 0 -2px $warning, 0 4px $body-color !important;
        text-decoration: none !important;
        color: $body-color !important;
      }

      // Some components (e.g. Quarto's search icon) set their own
      // explicit, non-inherited `color` on a nested element rather than
      // inheriting it from the focused parent - `color` above never
      // reaches them, so this forces it down explicitly. `background-color`
      // is reset too, since inline `code` has its own opaque background
      // (monospace-inline above) that otherwise sits as a grey box on top
      // of the parent's yellow fill when e.g. a link wraps a code span.
      :focus:focus:focus:focus:focus * {
        color: $body-color !important;
        background-color: transparent !important;
      }

      // Text-entry controls (search boxes, form inputs) keep their own
      // background and get an outline instead of the fill above, so
      // typed / existing text stays legible - GOV.UK's real
      // govuk-input:focus is an outline only, not a filled background,
      // unlike its buttons / links. The extra type selector (on top of
      // matching specificity) is what wins this over the general rule
      // above for the same element, e.g. Quarto's search input.
      input:focus:focus:focus:focus:focus,
      textarea:focus:focus:focus:focus:focus,
      select:focus:focus:focus:focus:focus {
        background-color: $body-bg !important;
        outline: 3px solid $warning !important;
        outline-offset: 0 !important;
        box-shadow: inset 0 0 0 2px $body-color !important;
      }
