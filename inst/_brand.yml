meta:
  name: GOV.UK Frontend
  link: https://github.com/alphagov/govuk-frontend
  description: >
    An unofficial brand.yml capturing the GOV.UK Design System's colour and
    typography tokens for use with Bootstrap-based Quarto documents, bslib
    Shiny apps, and pkgdown sites.

logo:
  images:
    favicon: logo/logo.png
  small: favicon

color:
  palette:
    brand-colour: "#1d70b8"
    text-colour: "#0b0c0c"
    secondary-text-colour: "#484949"
    error-colour: "#ca3535"
    success-colour: "#0f7a52"
    focus-colour: "#ffdd00"
    focus-text-colour: "#0b0c0c"
    link-colour: "#1a65a6"
    link-visited-colour: "#54319f"
    link-hover-colour: "#0f385c"
    link-active-colour: "#0b0c0c"
    border-colour: "#cecece"
    surface-background-colour: "#f4f8fb"
    surface-border-colour: "#8eb8dc"
    # Not an official GOV.UK Frontend token - taken from the design
    # system site's own CSS for code blocks.
    code-background-colour: "#f3f3f3"
  foreground: text-colour
  background: "#ffffff"
  primary: brand-colour
  secondary: secondary-text-colour
  success: success-colour
  danger: error-colour
  warning: focus-colour
  info: link-colour

# GOV.UK's real typeface (GDS Transport) is *.gov.uk-only, so this uses
# GOV.UK Frontend's own Arial fallback instead.
typography:
  base:
    family: "Arial, sans-serif"
  headings:
    family: "Arial, sans-serif"
    weight: 700
  link:
    color: link-colour
    decoration: underline
  monospace:
    family: >-
      ui-monospace, menlo, "Cascadia Mono", "Segoe UI Mono", consolas,
      "Liberation Mono", monospace
  monospace-inline:
    color: text-colour
    background-color: code-background-colour
  monospace-block:
    color: text-colour
    background-color: code-background-colour

defaults:
  bootstrap:
    defaults:
      link-hover-color: "#0f385c" # = link-hover-colour above
      link-decoration: underline
    rules: |
      // Matches GOV.UK's link underline: thicker, offset from the text,
      // and no gaps around descenders like "g"/"y". Bootstrap's
      // link-decoration only sets text-decoration, not these extra
      // properties - see design-system.service.gov.uk/styles/typography/#links
      // #{"..."} stops Sass evaluating max() itself, passing it to CSS
      // unchanged.
      a {
        text-decoration-thickness: #{"max(1px, .0625rem)"};
        text-underline-offset: .1105em;
      }

      a:hover {
        text-decoration-thickness: #{"max(3px, .1875rem)"};
        text-decoration-skip-ink: none;
      }

      // GOV.UK's focus style: solid yellow background, black shadow
      // beneath, never just an outline. Text is forced black so
      // light-coloured components (e.g. white navbar links) stay
      // readable on yellow. :focus is repeated to out-specificity
      // Bootstrap's own !important focus rules, rather than overriding
      // every component individually.
      :focus:focus:focus:focus:focus {
        outline: 3px solid transparent !important;
        background-color: $warning !important;
        box-shadow: 0 -2px $warning, 0 4px $body-color !important;
        text-decoration: none !important;
        color: $body-color !important;
      }

      // Some components (e.g. Quarto's search icon) set colour on a
      // child element instead of inheriting it, so this forces it down.
      // Also resets background-color, so inline code's own grey
      // background doesn't show through the yellow focus fill.
      :focus:focus:focus:focus:focus * {
        color: $body-color !important;
        background-color: transparent !important;
      }

      // Inputs keep their own background and get an outline instead of
      // a fill, matching GOV.UK's outline-only input focus style. The
      // type selector wins over the general focus rule above.
      input:focus:focus:focus:focus:focus,
      textarea:focus:focus:focus:focus:focus,
      select:focus:focus:focus:focus:focus {
        background-color: $body-bg !important;
        outline: 3px solid $warning !important;
        outline-offset: 0 !important;
        box-shadow: inset 0 0 0 2px $body-color !important;
      }
