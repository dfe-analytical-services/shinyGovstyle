name: Showcase loads

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::shinytest2, any::devtools
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Check showcase starts
        shell: Rscript {0}
        env:
          CHROMOTE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          devtools::install(dependencies = FALSE, build_vignettes = FALSE)
          local({
            app <- shinytest2::AppDriver$new(
              app_dir = "inst/example_app",
              load_timeout = 60000
            )
            on.exit(app$stop(), add = TRUE)
            testthat::expect_true(app$get_js("document.querySelector('main') !== null"))
          })
