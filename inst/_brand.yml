meta:
  name: GOV.UK Frontend
  link: https://github.com/alphagov/govuk-frontend
  description: >
    An unofficial brand.yml capturing the GOV.UK Design System's colour and
    typography tokens for use with Bootstrap-based Quarto documents, bslib
    Shiny apps, and pkgdown sites.

logo:
  images:
    crest: www/images/govuk-crest.svg
    favicon: www/images/favicon.ico
  small: favicon
  medium: crest
  large: crest

color:
  palette:
    brand-colour: "#1d70b8"
    text-colour: "#0b0c0c"
    secondary-text-colour: "#484949"
    error-colour: "#ca3535"
    success-colour: "#0f7a52"
    focus-colour: "#ffdd00"
    focus-text-colour: "#0b0c0c"
    link-colour: "#1a65a6"
    link-visited-colour: "#54319f"
    link-hover-colour: "#0f385c"
    link-active-colour: "#0b0c0c"
    border-colour: "#cecece"
    surface-background-colour: "#f4f8fb"
    surface-border-colour: "#8eb8dc"
    # Not an official GOV.UK Frontend token - taken from the design
    # system site's own CSS for code blocks.
    code-background-colour: "#f3f3f3"
    # Not official GOV.UK Frontend tokens - taken from GOV.UK's secondary
    # button and web colour palette, so update-tokens.sh doesn't manage
    # them. GOV.UK has no warning colour (yellow is only for focus), so
    # warning uses palette orange.
    secondary-button-colour: "#f3f3f3"
    orange: "#f47738"
  foreground: text-colour
  background: "#ffffff"
  primary: brand-colour
  # brand.yml defines secondary as lighter text, and bslib and Quarto use it
  # for muted text and placeholders, so it stays a text colour. The grey
  # secondary button colour is applied to .btn-secondary in rules below.
  secondary: secondary-text-colour
  success: success-colour
  danger: error-colour
  warning: orange
  info: link-colour

# GOV.UK's real typeface (GDS Transport) is *.gov.uk-only, so this uses
# GOV.UK Frontend's own Arial fallback instead.
typography:
  base:
    family: "Arial, sans-serif"
  headings:
    family: "Arial, sans-serif"
    weight: 700
  link:
    color: link-colour
    decoration: underline
  monospace:
    family: >-
      ui-monospace, menlo, "Cascadia Mono", "Segoe UI Mono", consolas,
      "Liberation Mono", monospace
  monospace-inline:
    color: text-colour
    background-color: code-background-colour
  monospace-block:
    color: text-colour
    background-color: code-background-colour

defaults:
  bootstrap:
    defaults:
      link-hover-color: "#0f385c" # = link-hover-colour above
      link-decoration: underline
      # GOV.UK buttons: square corners, 2px border
      btn-border-radius: 0
      btn-border-radius-sm: 0
      btn-border-radius-lg: 0
      btn-border-width: 2px
      # GOV.UK buttons change state instantly, with no colour fade
      btn-transition: none
      # Quarto callouts default to Bootstrap's own blue/green/red/yellow/
      # orange rather than the semantic slots, so point them at the brand.
      # Caution uses black, like GOV.UK's warning text component icon.
      # These use palette variables, not $info etc., because bslib writes
      # brand.defaults before brand.color, so the semantic slots don't
      # exist yet here.
      callout-color-note: $brand-link-colour # = info
      callout-color-tip: $brand-success-colour # = success
      callout-color-important: $brand-error-colour # = danger
      callout-color-warning: $brand-orange # = warning
      callout-color-caution: $brand-text-colour
    rules: |
      // Matches GOV.UK's link underline: thicker, offset from the text,
      // and no gaps around descenders like "g"/"y". Bootstrap's
      // link-decoration only sets text-decoration, not these extra
      // properties - see design-system.service.gov.uk/styles/typography/#links
      // #{"..."} stops Sass evaluating max() itself, passing it to CSS
      // unchanged.
      a {
        text-decoration-thickness: #{"max(1px, .0625rem)"};
        text-underline-offset: .1105em;
      }

      a:hover {
        text-decoration-thickness: #{"max(3px, .1875rem)"};
        text-decoration-skip-ink: none;
      }

      // GOV.UK content links show visited and active states by default.
      // Bootstrap navigation and button links keep their component-specific
      // colours, where a visited state would be distracting or misleading.
      a:not(.btn):not(.nav-link):not(.navbar-brand):not(.dropdown-item):not(.page-link):visited {
        color: $brand-link-visited-colour;
      }

      a:not(.btn):not(.nav-link):not(.navbar-brand):not(.dropdown-item):not(.page-link):active {
        color: $brand-link-active-colour;
      }

      // GOV.UK's focus style: solid yellow background, black shadow
      // beneath, never just an outline. Text is forced black so
      // light-coloured components (e.g. white navbar links) stay
      // readable on yellow. :focus is repeated to out-specificity
      // Bootstrap's own !important focus rules, rather than overriding
      // every component individually.
      :focus:focus:focus:focus:focus {
        outline: 3px solid transparent !important;
        background-color: $brand-focus-colour !important;
        box-shadow: 0 -2px $brand-focus-colour, 0 4px $body-color !important;
        text-decoration: none !important;
        color: $body-color !important;
      }

      // Some components (e.g. Quarto's search icon) set colour on a
      // child element instead of inheriting it, so this forces it down.
      // Also resets background-color, so inline code's own grey
      // background doesn't show through the yellow focus fill.
      :focus:focus:focus:focus:focus * {
        color: $body-color !important;
        background-color: transparent !important;
      }

      // The navbar toggler's icon is a background image, so the forced
      // text colour above can't reach it and it stays white on yellow.
      // Swap in a focus-text-colour icon and drop any filter a site uses
      // to invert it (e.g. pkgdown's extra.scss).
      .navbar-toggler:focus:focus:focus:focus:focus .navbar-toggler-icon {
        background-image: escape-svg(url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'><path stroke='#{$brand-focus-text-colour}' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/></svg>")) !important;
        filter: none !important;
      }

      // Inputs keep their own background and get an outline instead of
      // a fill, matching GOV.UK's outline-only input focus style. The
      // type selector wins over the general focus rule above.
      input:focus:focus:focus:focus:focus,
      textarea:focus:focus:focus:focus:focus,
      select:focus:focus:focus:focus:focus {
        background-color: $body-bg !important;
        outline: 3px solid $brand-focus-colour !important;
        outline-offset: 0 !important;
        box-shadow: inset 0 0 0 2px $body-color !important;
      }

      // The input rule above otherwise replaces the primary fill on checked
      // checkboxes and radios, leaving their white selected mark invisible.
      input[type="checkbox"]:checked:focus:focus:focus:focus:focus,
      input[type="radio"]:checked:focus:focus:focus:focus:focus {
        background-color: $primary !important;
      }

      // GOV.UK buttons: darker bottom shadow and darker hover per variant.
      // Hex values are GOV.UK palette tints/shades (not tracked by
      // update-tokens.sh). Success = GOV.UK default button, danger = warning
      // button. Warning's hover text is white, as black on orange shade-25
      // fails AA contrast.
      $govuk-buttons: (
        "primary":   (hover: #16548a, shadow: #0f385c, hover-text: #fff),
        "secondary": (hover: #cecece, shadow: #858686, hover-text: $body-color),
        "success":   (hover: #0b5c3e, shadow: #083d29, hover-text: #fff),
        "danger":    (hover: #982828, shadow: #651b1b, hover-text: #fff),
        "warning":   (hover: #b7592a, shadow: #7a3c1c, hover-text: #fff),
      );

      @each $name, $c in $govuk-buttons {
        .btn-#{$name} {
          --bs-btn-hover-bg: #{map-get($c, hover)};
          --bs-btn-hover-border-color: #{map-get($c, hover)};
          --bs-btn-hover-color: #{map-get($c, hover-text)};
          --bs-btn-active-bg: #{map-get($c, hover)};
          --bs-btn-active-border-color: #{map-get($c, hover)};
          --bs-btn-active-color: #{map-get($c, hover-text)};
          box-shadow: 0 2px 0 map-get($c, shadow);
        }
      }

      // GOV.UK's secondary button: light grey with near-black text. Set here
      // rather than via `secondary`, which brand.yml reserves for lighter text.
      .btn-secondary {
        --bs-btn-bg: #{$brand-secondary-button-colour};
        --bs-btn-border-color: #{$brand-secondary-button-colour};
        --bs-btn-color: #{$body-color};
        --bs-btn-disabled-bg: #{$brand-secondary-button-colour};
        --bs-btn-disabled-border-color: #{$brand-secondary-button-colour};
        --bs-btn-disabled-color: #{$body-color};
      }

      // Info is GOV.UK's inverse button (white, brand-blue text) rather
      // than a second blue button. Only the button changes - the info
      // colour itself still drives alerts, callouts and bg-info.
      // A brand-blue border keeps it visible on white backgrounds.
      .btn-info {
        --bs-btn-bg: #fff;
        --bs-btn-border-color: #{$primary};
        --bs-btn-color: #{$primary};
        --bs-btn-hover-bg: #f4f8fb;
        --bs-btn-hover-border-color: #{$primary};
        --bs-btn-hover-color: #{$primary};
        --bs-btn-active-bg: #f4f8fb;
        --bs-btn-active-border-color: #{$primary};
        --bs-btn-active-color: #{$primary};
        box-shadow: 0 2px 0 #0f385c;
      }

      // Pressed state, as GOV.UK's .govuk-button:active. Uses transform
      // rather than GOV.UK's position/top, so absolutely positioned buttons
      // (e.g. pkgdown and Quarto code copy buttons) don't jump on click.
      .btn:active {
        transform: translateY(2px);
      }

      // GOV.UK button focus, overriding the general focus rule above (one
      // extra class for specificity). Focused: solid yellow including the
      // border, black text, 2px black shadow beneath.
      .btn:focus:focus:focus:focus:focus {
        background-color: $brand-focus-colour !important;
        border-color: $brand-focus-colour !important;
        color: $brand-focus-text-colour !important;
        box-shadow: 0 2px 0 $brand-focus-text-colour !important;
      }

      // Pressed or hovered while focused: the button keeps its own colour,
      // with a yellow border and no shadow, as .govuk-button:focus.
      .btn:focus:focus:focus:focus:focus:active,
      .btn:focus:focus:focus:focus:focus:hover {
        background-color: var(--bs-btn-hover-bg) !important;
        color: var(--bs-btn-hover-color) !important;
        box-shadow: inset 0 0 0 1px $brand-focus-colour !important;
      }

      // Child elements (e.g. the icon in pkgdown's copy button) would keep
      // the black forced by the focus rule above, which is unreadable while
      // the button holds its own colour, so follow the button's text colour.
      .btn:focus:focus:focus:focus:focus:active *,
      .btn:focus:focus:focus:focus:focus:hover * {
        color: var(--bs-btn-hover-color) !important;
      }
